version: "3.9"

# Quick local / demo deployment with PostgreSQL.
# Production: use secrets manager, TLS reverse proxy, non-root containers. See DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: stockapp
      POSTGRES_DB: stockapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockapp"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://stockapp:stockapp@postgres:5432/stockapp
      - MARKET_DATA_PROVIDER=india
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@stockapp.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend

volumes:
  postgres-data:
